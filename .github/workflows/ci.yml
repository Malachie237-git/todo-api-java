name: CI

on:
  pull_request:
    branches: [ develop ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Format Check (Spotless)
        run: ./mvnw spotless:check

      - name: Linting (Checkstyle)
        run: ./mvnw checkstyle:check

      - name: Build & Test
        run: ./mvnw verify
